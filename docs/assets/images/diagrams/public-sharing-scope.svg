<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Public sharing scope: the project's visibility switch publishes the project with its subjects, sessions, specimen sets, their modules and logs, and templates shared with it; setups, inventories, behavioral assays, protocols and licenses have their own switch, and a data storage is public through its data protocols; the catalog, taxonomies and publications are always public; planned entries, memberships, permissions, email addresses and API tokens never are.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f6d82"/>
    </marker>
  </defs>
  <rect width="1400" height="800" fill="#fff"/>
  <text x="40" y="40" font-size="18" font-weight="600" fill="#2c2a38">What making a project public publishes</text>
  <rect x="40" y="64" width="660" height="502" rx="8" fill="#6f6d82" fill-opacity="0.07" stroke="#6f6d82" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="54" y="88" font-size="16" font-weight="600" fill="#6f6d82">Published by the project's Project visibility switch</text>
  <rect x="70" y="108" width="600" height="46" rx="7" fill="#8122a1" stroke="#5d1874" stroke-width="1.2"/>
  <text x="370" y="136.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Project</text>
  <rect x="70" y="172" width="250" height="134" rx="7" fill="#8122a1" stroke="#5d1874" stroke-width="1.2"/>
  <text x="195" y="222.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Subjects</text>
  <text x="195" y="244.5" font-size="15" fill="#fff" text-anchor="middle">with cohorts</text>
  <text x="195" y="266.5" font-size="15" fill="#fff" text-anchor="middle">and breedings</text>
  <rect x="340" y="172" width="330" height="60" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="505" y="196.5" font-size="17" font-weight="600" fill="#225b63" text-anchor="middle">Procedures, episodes</text>
  <text x="505" y="218.5" font-size="15" fill="#2c2a38" text-anchor="middle">procedure logs, interfaces</text>
  <rect x="340" y="246" width="330" height="60" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="505" y="270.5" font-size="17" font-weight="600" fill="#225b63" text-anchor="middle">Subject logs</text>
  <text x="505" y="292.5" font-size="15" fill="#2c2a38" text-anchor="middle">with their entries</text>
  <rect x="70" y="324" width="250" height="60" rx="7" fill="#8122a1" stroke="#5d1874" stroke-width="1.2"/>
  <text x="195" y="348.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Sessions</text>
  <text x="195" y="370.5" font-size="15" fill="#fff" text-anchor="middle">collections, epochs</text>
  <rect x="340" y="324" width="330" height="60" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="505" y="348.5" font-size="17" font-weight="600" fill="#225b63" text-anchor="middle">Session modules</text>
  <text x="505" y="370.5" font-size="15" fill="#2c2a38" text-anchor="middle">behaviors, acquisitions, manipulations</text>
  <rect x="70" y="402" width="250" height="60" rx="7" fill="#8122a1" stroke="#5d1874" stroke-width="1.2"/>
  <text x="195" y="426.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Specimen sets</text>
  <text x="195" y="448.5" font-size="15" fill="#fff" text-anchor="middle">and specimens</text>
  <rect x="340" y="402" width="330" height="60" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="505" y="426.5" font-size="17" font-weight="600" fill="#225b63" text-anchor="middle">Specimen procedures</text>
  <text x="505" y="448.5" font-size="15" fill="#2c2a38" text-anchor="middle">and specimen logs</text>
  <rect x="70" y="480" width="600" height="60" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="370" y="504.5" font-size="17" font-weight="600" fill="#225b63" text-anchor="middle">Templates shared with the project</text>
  <text x="370" y="526.5" font-size="15" fill="#2c2a38" text-anchor="middle">read-only in the public portal</text>
  <rect x="740" y="64" width="620" height="502" rx="8" fill="#6f6d82" fill-opacity="0.07" stroke="#6f6d82" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="754" y="88" font-size="16" font-weight="600" fill="#6f6d82">Public only with their own visibility switch</text>
  <text x="754" y="106" font-size="14" fill="#4a4858" text-anchor="start">Private or Public, set on each entry</text>
  <rect x="760" y="124" width="250" height="52" rx="7" fill="#3f6bb3" stroke="#2d4d81" stroke-width="1.2"/>
  <text x="885" y="155.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Setups</text>
  <rect x="760" y="188" width="250" height="52" rx="7" fill="#3f6bb3" stroke="#2d4d81" stroke-width="1.2"/>
  <text x="885" y="219.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Inventories</text>
  <rect x="760" y="252" width="250" height="52" rx="7" fill="#3f6bb3" stroke="#2d4d81" stroke-width="1.2"/>
  <text x="885" y="283.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Behavioral assays</text>
  <rect x="760" y="316" width="250" height="52" rx="7" fill="#3f6bb3" stroke="#2d4d81" stroke-width="1.2"/>
  <text x="885" y="347.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Protocols</text>
  <rect x="760" y="380" width="250" height="52" rx="7" fill="#3f6bb3" stroke="#2d4d81" stroke-width="1.2"/>
  <text x="885" y="411.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Licenses</text>
  <path d="M1010 150 L1050 150" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1050" y="124" width="290" height="52" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="1195" y="145" font-size="17" font-weight="600" fill="#225b63" text-anchor="middle">Equipment</text>
  <text x="1195" y="166" font-size="14" fill="#2c2a38" text-anchor="middle">public with its setup</text>
  <path d="M1010 214 L1050 214" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1050" y="188" width="290" height="52" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="1195" y="209" font-size="17" font-weight="600" fill="#225b63" text-anchor="middle">Consumable stock</text>
  <text x="1195" y="230" font-size="14" fill="#2c2a38" text-anchor="middle">public with its inventory</text>
  <rect x="760" y="460" width="250" height="76" rx="7" fill="#3f6bb3" stroke="#2d4d81" stroke-width="1.2"/>
  <text x="885" y="503.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Data storage</text>
  <path d="M1050 498 L1010 498" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="1050" y="460" width="290" height="76" rx="6" fill="#fbf8ee" stroke="#d8d0b4" stroke-width="1"/>
  <text x="1064" y="491.5" font-size="15" fill="#4a4858">public when one of its data</text>
  <text x="1064" y="513.5" font-size="15" fill="#4a4858">protocols has Public Access</text>
  <rect x="40" y="586" width="660" height="190" rx="8" fill="#6f6d82" fill-opacity="0.07" stroke="#6f6d82" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="54" y="610" font-size="16" font-weight="600" fill="#6f6d82">Always public</text>
  <rect x="60" y="630" width="200" height="120" rx="7" fill="#9a5a14" stroke="#6f410e" stroke-width="1.2"/>
  <text x="160" y="673.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Resources</text>
  <text x="160" y="695.5" font-size="15" fill="#fff" text-anchor="middle">consumables, devices,</text>
  <text x="160" y="717.5" font-size="15" fill="#fff" text-anchor="middle">suppliers</text>
  <rect x="270" y="630" width="200" height="120" rx="7" fill="#6b7c2a" stroke="#4d591e" stroke-width="1.2"/>
  <text x="370" y="673.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Taxonomies</text>
  <text x="370" y="695.5" font-size="15" fill="#fff" text-anchor="middle">species, strains,</text>
  <text x="370" y="717.5" font-size="15" fill="#fff" text-anchor="middle">atlases, regions</text>
  <rect x="480" y="630" width="200" height="120" rx="7" fill="#a8365e" stroke="#792744" stroke-width="1.2"/>
  <text x="580" y="673.5" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Dissemination</text>
  <text x="580" y="695.5" font-size="15" fill="#fff" text-anchor="middle">publications</text>
  <text x="580" y="717.5" font-size="15" fill="#fff" text-anchor="middle">and journals</text>
  <rect x="740" y="586" width="620" height="190" rx="8" fill="#6f6d82" fill-opacity="0.07" stroke="#6f6d82" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="754" y="610" font-size="16" font-weight="600" fill="#6f6d82">Never public</text>
  <rect x="760" y="628" width="280" height="52" rx="7" fill="#f4f3f8" stroke="#c9c6d6" stroke-width="1.2"/>
  <text x="900" y="659" font-size="16" font-weight="600" fill="#2c2a38" text-anchor="middle">Planned, cancelled entries</text>
  <rect x="1060" y="628" width="280" height="52" rx="7" fill="#f4f3f8" stroke="#c9c6d6" stroke-width="1.2"/>
  <text x="1200" y="659" font-size="16" font-weight="600" fill="#2c2a38" text-anchor="middle">Memberships, permissions</text>
  <rect x="760" y="700" width="280" height="52" rx="7" fill="#f4f3f8" stroke="#c9c6d6" stroke-width="1.2"/>
  <text x="900" y="731" font-size="16" font-weight="600" fill="#2c2a38" text-anchor="middle">Email addresses</text>
  <rect x="1060" y="700" width="280" height="52" rx="7" fill="#f4f3f8" stroke="#c9c6d6" stroke-width="1.2"/>
  <text x="1200" y="731" font-size="16" font-weight="600" fill="#2c2a38" text-anchor="middle">API tokens</text>
</svg>
