  <path d="M700 150 L1190 150 L1190 190" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="455" y="142" font-size="15" fill="#4a4858" text-anchor="middle">belongs to</text>
  <text x="945" y="142" font-size="15" fill="#4a4858" text-anchor="middle">belongs to</text>
  <path d="M360 238 L500 238" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="430" y="228" font-size="15" fill="#4a4858" text-anchor="middle">contains</text>
  <path d="M1040 238 L900 238" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="970" y="228" font-size="15" fill="#4a4858" text-anchor="middle">contains</text>
  <path d="M60 238 L32 238 L32 658 L60 658" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M210 286 L210 340" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="225" y="318" font-size="15" fill="#4a4858" text-anchor="start">links</text>
  <path d="M1190 286 L1190 340" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1205" y="318" font-size="15" fill="#4a4858" text-anchor="start">links</text>
  <path d="M210 416 L210 480" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="225" y="453" font-size="15" fill="#4a4858" text-anchor="start">interfaces installed on it</text>
  <path d="M1190 416 L1190 480" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1205" y="453" font-size="15" fill="#4a4858" text-anchor="start">interfaces targeting it</text>
  <path d="M360 528 L650 528 L650 436" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="505" y="548" font-size="15" fill="#4a4858" text-anchor="middle">used by its acquisitions</text>
  <path d="M1040 528 L750 528 L750 436" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="895" y="548" font-size="15" fill="#4a4858" text-anchor="middle">used by its acquisitions</text>
