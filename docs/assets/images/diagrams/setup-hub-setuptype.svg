<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 580" width="1300" height="580" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Where setups and equipment are used: a setup is built as a setup type and holds equipment, which can name its catalog model; procedures, specimen procedures, experimental interfaces, data acquisitions and manipulations name the equipment they used, and a behavior names the setup.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f6d82"/>
    </marker>
  </defs>
  <rect width="1300" height="580" fill="#fff"/>
  <path d="M330 102 L480 102" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="405" y="94" font-size="15" fill="#4a4858" text-anchor="middle">built as</text>
  <path d="M330 262 L480 262" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="405" y="254" font-size="15" fill="#4a4858" text-anchor="middle">catalog model</text>
  <path d="M650 220 L650 144" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="662" y="184" font-size="15" fill="#4a4858" text-anchor="start">installed in</text>
  <path d="M650 304 L650 380" fill="none" stroke="#6f6d82" stroke-width="1.6"/>
  <path d="M125 380 L965 380" fill="none" stroke="#6f6d82" stroke-width="1.6"/>
  <text x="662" y="366" font-size="15" fill="#4a4858" text-anchor="start">used by (each names the equipment it used)</text>
  <path d="M125 380 L125 430" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M335 380 L335 430" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M545 380 L545 430" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M755 380 L755 430" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M965 380 L965 430" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M820 102 L1175 102 L1175 430" fill="none" stroke="#6f6d82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1163.0" y="94" font-size="15" fill="#4a4858" text-anchor="end">used by (a behavior names its setup)</text>
  <rect x="40" y="60" width="290" height="84" rx="7" fill="#6b7c2a" stroke="#4d591e" stroke-width="1.2"/>
  <text x="185" y="86.5" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">Setup type</text>
  <text x="185" y="108.5" font-size="15" fill="#fff" text-anchor="middle">Head-fixed disc</text>
  <text x="185" y="130.5" font-size="15" fill="#fff" text-anchor="middle">the class of station</text>
  <rect x="480" y="60" width="340" height="84" rx="7" fill="#eaeff7" stroke="#95aed5" stroke-width="1.2"/>
  <text x="650" y="86.5" font-size="19" font-weight="600" fill="#2d4d81" text-anchor="middle">Setup</text>
  <text x="650" y="108.5" font-size="15" fill="#2c2a38" text-anchor="middle">Ephys rig A, Room 108</text>
  <text x="650" y="130.5" font-size="15" fill="#2c2a38" text-anchor="middle">your physical rig</text>
  <rect x="40" y="220" width="290" height="84" rx="7" fill="#f4ede5" stroke="#c7a47e" stroke-width="1.2"/>
  <text x="185" y="246.5" font-size="19" font-weight="600" fill="#6f410e" text-anchor="middle">Catalog entry</text>
  <text x="185" y="268.5" font-size="15" fill="#2c2a38" text-anchor="middle">Intan RHD 64-ch headstage</text>
  <text x="185" y="290.5" font-size="15" fill="#2c2a38" text-anchor="middle">a hardware device or consumable</text>
  <rect x="480" y="220" width="340" height="84" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="650" y="246.5" font-size="19" font-weight="600" fill="#225b63" text-anchor="middle">Equipment</text>
  <text x="650" y="268.5" font-size="15" fill="#2c2a38" text-anchor="middle">headstage, camera, stereotax</text>
  <text x="650" y="290.5" font-size="15" fill="#2c2a38" text-anchor="middle">one item in one setup</text>
  <rect x="30.0" y="430" width="190" height="80" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="125" y="465" font-size="16" font-weight="600" fill="#225b63" text-anchor="middle">Procedures</text>
  <text x="125" y="485" font-size="13" fill="#2c2a38" text-anchor="middle">surgeries, injections</text>
  <rect x="240.0" y="430" width="190" height="80" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="335" y="465" font-size="16" font-weight="600" fill="#225b63" text-anchor="middle">Specimen procedures</text>
  <text x="335" y="485" font-size="13" fill="#2c2a38" text-anchor="middle">sectioning, staining</text>
  <rect x="450.0" y="430" width="190" height="80" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="545" y="465" font-size="16" font-weight="600" fill="#225b63" text-anchor="middle">Experimental interfaces</text>
  <text x="545" y="485" font-size="13" fill="#2c2a38" text-anchor="middle">probes, fibers, windows</text>
  <rect x="660.0" y="430" width="190" height="80" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="755" y="465" font-size="16" font-weight="600" fill="#225b63" text-anchor="middle">Data acquisitions</text>
  <text x="755" y="485" font-size="13" fill="#2c2a38" text-anchor="middle">ephys, imaging, video</text>
  <rect x="870.0" y="430" width="190" height="80" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="965" y="465" font-size="16" font-weight="600" fill="#225b63" text-anchor="middle">Manipulations</text>
  <text x="965" y="485" font-size="13" fill="#2c2a38" text-anchor="middle">stimulation, perturbation</text>
  <rect x="1080.0" y="430" width="190" height="80" rx="7" fill="#e8f1f2" stroke="#8db9bf" stroke-width="1.2"/>
  <text x="1175" y="465" font-size="16" font-weight="600" fill="#225b63" text-anchor="middle">Behaviors</text>
  <text x="1175" y="485" font-size="13" fill="#2c2a38" text-anchor="middle">an assay run on a setup</text>
  <text x="335.0" y="538" font-size="15" fill="#4a4858" text-anchor="middle">on a subject or specimen set</text>
  <text x="965.0" y="538" font-size="15" fill="#4a4858" text-anchor="middle">in a session</text>
</svg>
