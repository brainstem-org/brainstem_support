# Written by scripts/screenshots.py (tour): the opening card and the chapters of the landing-page tour.
intro:
  title: "BrainSTEM at a glance"
  text: "An electronic lab notebook for experimental neuroscience. A short tour of its key features follows."
chapters:
  - file: "01-records.webm"
    poster: "01-records.jpg"
    title: "Complete experimental records"
    text: "A procedure filled in field by field, placed in the atlas, and the sessions that follow"
    doc: "/datamodel/"
    link: "See the data model"
    cues:
      - {t: 0.0, text: "Every procedure, recording and log has a type", doc: "/datamodel/modules/procedure/", link: "About procedures"}
      - {t: 5.09, text: "Link it to its subject, setup, atlas and target brain region", doc: "/webinterface/forms/", link: "How forms work"}
      - {t: 20.96, text: "Each type adds its own fields: here the implant's stereotaxic coordinates", doc: "/webinterface/atlases-and-coordinates/", link: "More about coordinates"}
      - {t: 28.07, text: "Its coordinates place the implant in the rat brain atlas", doc: "/webinterface/atlases-and-coordinates/", link: "More about atlases and coordinates"}
      - {t: 34.9, text: "Sessions with the implanted rat line up their epochs, behavior and recordings", doc: "/datamodel/stem/epoch/", link: "About epochs"}
  - file: "02-compliance.webm"
    poster: "02-compliance.jpg"
    title: "Collaboration and compliance"
    text: "Roles for people and groups, procedure episodes with severity and licenses"
    doc: "/datamodel/permissions/"
    link: "Learn about permissions"
    cues:
      - {t: 0.0, text: "Projects share their records with people and groups, by role", doc: "/datamodel/permissions/", link: "Learn about permissions"}
      - {t: 8.33, text: "Procedure episodes record their severity and licenses", doc: "/datamodel/modules/procedureepisode/", link: "About procedure episodes"}
  - file: "03-resources.webm"
    poster: "03-resources.jpg"
    title: "Shared resources and taxonomies"
    text: "A shared catalog of probe designs, devices and reagents, and taxonomies of species and strains"
    doc: "/webinterface/probe-catalog/"
    link: "More about the probe catalog"
    cues:
      - {t: 0.0, text: "A shared catalog of consumables, with hundreds of probe designs", doc: "/webinterface/probe-catalog/", link: "More about the probe catalog"}
      - {t: 3.1, text: "Each design is drawn from its geometry", doc: "/webinterface/probe-catalog/", link: "More about the probe catalog"}
      - {t: 5.7, text: "Species and strains come from shared taxonomies", doc: "/datamodel/taxonomies/", link: "About taxonomies"}
  - file: "04-open-science.webm"
    poster: "04-open-science.jpg"
    title: "Open science"
    text: "Public projects, JSON exports for NWB conversion, and STAR Methods reports"
    doc: "/tutorials/sharing-project-publicly/"
    link: "How to share a project publicly"
    cues:
      - {t: 0.0, text: "Make a project public in one step", doc: "/tutorials/sharing-project-publicly/", link: "How to share a project publicly"}
      - {t: 2.4, text: "Its records then appear on the public portal and API", doc: "/tutorials/sharing-project-publicly/", link: "How to share a project publicly"}
      - {t: 5.57, text: "Download a whole project, or one session to convert to NWB", doc: "/tutorials/exporting-to-nwb/", link: "How to export to NWB"}
      - {t: 12.9, text: "A STAR Methods draft with the RRIDs for your paper", doc: "/webinterface/exports-and-reports/", link: "More about exports and reports"}
  - file: "05-programmable.webm"
    poster: "05-programmable.jpg"
    title: "Programmable and AI ready"
    text: "Every record through the REST API, and plain-language search with the AI assistant"
    doc: "/api/"
    link: "Explore the API"
    cues:
      - {t: 0.0, text: "Every record through the REST API, from Python or MATLAB", doc: "/api/", link: "Explore the API"}
      - {t: 6.0, text: "The AI assistant offers plain-language, semantic search of your records", doc: "/webinterface/ai-assistant/", link: "About the AI assistant"}
  - file: "06-integrations.webm"
    poster: "06-integrations.jpg"
    title: "Integrations"
    text: "Batch entry and CSV import, every row checked before anything is created"
    doc: "/webinterface/import-tool/"
    link: "Learn about the import tool"
    cues:
      - {t: 0.0, text: "Enter rows one field at a time, or paste them from a spreadsheet", doc: "/webinterface/import-tool/", link: "Learn about the import tool"}
      - {t: 15.17, text: "Each row is checked before anything is imported", doc: "/webinterface/import-tool/", link: "Learn about the import tool"}
